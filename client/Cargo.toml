[package]
name = "client"
version = "0.1.0"
edition = "2021"
# This crate ships two binaries (`client` and `capture`), so bare `cargo run -p client`
# is ambiguous without this. run.sh relies on it.
default-run = "client"

[features]
# Iteration speed: links Bevy as a shared library so a code change relinks in seconds
# instead of rebuilding the whole binary. Dev only - never ship with this on.
#   cargo run -p client --features dev
dev = ["bevy/dynamic_linking"]
# Deterministic raw H.264 capture through Bevy's x264-backed developer tool.
# Kept opt-in because x264 is a sizeable native build dependency and Windows is
# not supported by Bevy 0.19's recorder.
capture-video = ["dep:bevy_dev_tools", "bevy_dev_tools/screenrecording"]

[dependencies]
bevy = { workspace = true }
lightyear = { workspace = true }
shared = { path = "../shared" }
rand = "0.8"
ron = "0.8"
serde = { workspace = true }
arboard = "3"
image = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_dev_tools = { version = "0.19.0", optional = true }

[package.metadata.bundle]
name = "3DGame"
identifier = "com.terninator.3dgame"
category = "Game"
short_description = "A 3D multiplayer game"
resources = ["assets"]
