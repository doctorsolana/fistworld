[alias]
# Deterministic headless village soak with milestone and stall reporting.
village-lab = "test -p server village_simulation_lab -- --ignored --nocapture --test-threads=1"
# Optimised synthetic subsystem probes; not a complete server tick or capacity claim.
village-scale-lab = "test --release -p server village_scale_lab -- --ignored --nocapture --test-threads=1"
# Bounded real town growth, periodic accepted-state JSON for report and captures.
town-growth-lab = "test -p server town_growth_lab -- --ignored --nocapture --test-threads=1"
