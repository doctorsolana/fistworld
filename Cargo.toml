[workspace]
resolver = "2"
members = [
    "shared",
    "server",
    "client",
    "editor",
    "tools/collider_baker",
    "tools/terrain_ktx_builder",
]

[workspace.dependencies]
bevy = { version = "0.19.0", features = ["vorbis", "jpeg", "ktx2"] }
lightyear = { version = "0.28", features = ["udp", "netcode"] }
serde = { version = "1.0", features = ["derive"] }
noise = "0.9"
rand = "0.8"
ron = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

# Faster compile times during development
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Thin LTO: a few percent of free runtime perf in release builds for a modest
# increase in link time.
[profile.release]
lto = "thin"
