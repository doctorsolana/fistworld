:root[data-theme=&quot;light&quot;] {

h5,

}

b,

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  background: var(--accent);

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

.btn,

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {

.btn-ghost:not(:disabled):hover {

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {

  opacity: 0.4;

[data-lucide] {

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-check-input {

  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {

  height: 20px;

  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;

  margin: 0;
  padding: 0;

&lt;style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;regional-walled-city-lab&#x27;);
  const canvas = root.querySelector(&#x27;#regional-city-canvas&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;);
  const styleControl = root.querySelector(&#x27;#regional-style&#x27;);
  const populationControl = root.querySelector(&#x27;#regional-population&#x27;);
  const seedControl = root.querySelector(&#x27;#regional-seed&#x27;);
  const TAU = Math.PI * 2;

  function color(name) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = `var(${name})`;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function palette() {
    return {
      background: color(&#x27;--background&#x27;), foreground: color(&#x27;--foreground&#x27;), border: color(&#x27;--border&#x27;),
      muted: color(&#x27;--muted&#x27;), mutedForeground: color(&#x27;--muted-foreground&#x27;), road: color(&#x27;--viz-series-6&#x27;),
      house: color(&#x27;--viz-series-1&#x27;), farm: color(&#x27;--viz-series-2&#x27;), industry: color(&#x27;--viz-series-3&#x27;),
      business: color(&#x27;--viz-series-4&#x27;), door: color(&#x27;--viz-series-5&#x27;)
    };
  }

  function mulberry32(seed) {
    let state = seed &gt;&gt;&gt; 0;
    return () =&gt; {
      state += 0x6D2B79F5;
      let value = state;
      value = Math.imul(value ^ (value &gt;&gt;&gt; 15), value | 1);
      value ^= value + Math.imul(value ^ (value &gt;&gt;&gt; 7), value | 61);
      return ((value ^ (value &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
    };
  }

  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function offset(point, angle, distance) { return { x: point.x + Math.cos(angle) * distance, y: point.y + Math.sin(angle) * distance }; }
  function bounded(point) { return { x: clamp(point.x, 105, 1015), y: clamp(point.y, 82, 598) }; }

  function stageFor(population) {
    if (population &lt; 150) return { level: 1, name: &#x27;Hamlet&#x27; };
    if (population &lt; 350) return { level: 2, name: &#x27;Village&#x27; };
    if (population &lt; 600) return { level: 3, name: &#x27;Large village&#x27; };
    if (population &lt; 850) return { level: 4, name: &#x27;Town&#x27; };
    return { level: 5, name: &#x27;Regional town&#x27; };
  }

  function selectedRegion(seed) {
    if (styleControl.value !== &#x27;auto&#x27;) return styleControl.value;
    return [&#x27;north&#x27;, &#x27;central&#x27;, &#x27;south&#x27;][seed % 3];
  }

  function makeEnvironment(seed, region) {
    const rng = mulberry32(seed * 7919 + region.length * 317);
    const shoreSide = Math.floor(rng() * 4);
    const axis = rng() * TAU;
    const core = { x: 525 + rng() * 70, y: 315 + rng() * 50 };
    const resourceAngle = axis + 1.5 + rng() * 0.55;
    const forest = bounded(offset(core, resourceAngle, 305 + rng() * 55));
    const fields = bounded(offset(core, resourceAngle + 2.35, 300 + rng() * 65));
    return {
      seed, region, rng, axis, core, shoreSide,
      shoreDepth: 43 + rng() * 27, shorePhase: rng() * TAU,
      forest: { ...forest, rx: region === &#x27;north&#x27; ? 168 : 128, ry: region === &#x27;north&#x27; ? 104 : 84 },
      fields: { ...fields, rx: region === &#x27;central&#x27; ? 170 : 135, ry: region === &#x27;central&#x27; ? 100 : 82 }
    };
  }

  function shoreBoundary(value, env) {
    return env.shoreDepth + Math.sin(value / 68 + env.shorePhase) * 17 + Math.sin(value / 149) * 8;
  }

  function isWater(x, y, env) {
    const boundary = env.shoreSide &lt; 2 ? shoreBoundary(y, env) : shoreBoundary(x, env);
    if (env.shoreSide === 0) return x &lt; boundary + 12;
    if (env.shoreSide === 1) return x &gt; canvas.width - boundary - 12;
    if (env.shoreSide === 2) return y &lt; boundary + 12;
    return y &gt; canvas.height - boundary - 12;
  }

  function regionalDeck(region, seed) {
    const forms = {
      north: [
        { name: &#x27;ridge fort&#x27;, type: &#x27;spine&#x27; },
        { name: &#x27;fjord chain&#x27;, type: &#x27;spine&#x27;, shoreAligned: true },
        { name: &#x27;clan clusters&#x27;, type: &#x27;clusters&#x27; },
        { name: &#x27;frontier cross&#x27;, type: &#x27;cross&#x27; }
      ],
      central: [
        { name: &#x27;market cross&#x27;, type: &#x27;cross&#x27; },
        { name: &#x27;river-road spine&#x27;, type: &#x27;spine&#x27; },
        { name: &#x27;twin boroughs&#x27;, type: &#x27;twin&#x27; },
        { name: &#x27;abbey satellites&#x27;, type: &#x27;clusters&#x27; },
        { name: &#x27;organic web&#x27;, type: &#x27;web&#x27; }
      ],
      south: [
        { name: &#x27;courtyard web&#x27;, type: &#x27;web&#x27; },
        { name: &#x27;caravan spine&#x27;, type: &#x27;spine&#x27; },
        { name: &#x27;terrace fan&#x27;, type: &#x27;fan&#x27; },
        { name: &#x27;port crescent&#x27;, type: &#x27;crescent&#x27;, shoreAligned: true },
        { name: &#x27;oasis clusters&#x27;, type: &#x27;clusters&#x27; }
      ]
    };
    const decks = {
      north: {
        core: [{ name: &#x27;Hallfort&#x27;, pattern: &#x27;fort&#x27; }, { name: &#x27;Old Longhouse Green&#x27;, pattern: &#x27;commons&#x27; }],
        pool: [
          { name: &#x27;Pineward&#x27;, pattern: &#x27;roadside&#x27;, specialty: &#x27;industry&#x27; },
          { name: &#x27;Frost Market&#x27;, pattern: &#x27;crossroads&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Highfold&#x27;, pattern: &#x27;contour&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Longhouse Row&#x27;, pattern: &#x27;ribbon&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Goat Crofts&#x27;, pattern: &#x27;resource&#x27;, specialty: &#x27;farm&#x27; },
          { name: &#x27;Harbour Ward&#x27;, pattern: &#x27;ribbon&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Outer Bailey&#x27;, pattern: &#x27;fort&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Smithy Ward&#x27;, pattern: &#x27;grid&#x27;, specialty: &#x27;industry&#x27; },
          { name: &#x27;Abbey Close&#x27;, pattern: &#x27;commons&#x27;, specialty: &#x27;house&#x27; }
        ]
      },
      central: {
        core: [{ name: &#x27;Old Green&#x27;, pattern: &#x27;commons&#x27; }, { name: &#x27;Market Cross&#x27;, pattern: &#x27;crossroads&#x27; }],
        pool: [
          { name: &#x27;Millfield&#x27;, pattern: &#x27;resource&#x27;, specialty: &#x27;farm&#x27; },
          { name: &#x27;Woodward&#x27;, pattern: &#x27;roadside&#x27;, specialty: &#x27;industry&#x27; },
          { name: &#x27;Market Borough&#x27;, pattern: &#x27;grid&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Guild Ward&#x27;, pattern: &#x27;grid&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Abbey Close&#x27;, pattern: &#x27;commons&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;River Row&#x27;, pattern: &#x27;ribbon&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;New Commons&#x27;, pattern: &#x27;commons&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Eastgate&#x27;, pattern: &#x27;crossroads&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Orchard End&#x27;, pattern: &#x27;irrigation&#x27;, specialty: &#x27;farm&#x27; }
        ]
      },
      south: {
        core: [{ name: &#x27;Old Courtyard&#x27;, pattern: &#x27;courtyards&#x27; }, { name: &#x27;Bazaar Core&#x27;, pattern: &#x27;crossroads&#x27; }],
        pool: [
          { name: &#x27;Bazaar Ward&#x27;, pattern: &#x27;grid&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Orchard Quarter&#x27;, pattern: &#x27;irrigation&#x27;, specialty: &#x27;farm&#x27; },
          { name: &#x27;Terrace Ward&#x27;, pattern: &#x27;contour&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Caravan Gate&#x27;, pattern: &#x27;roadside&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Garden Courts&#x27;, pattern: &#x27;courtyards&#x27;, specialty: &#x27;house&#x27; },
          { name: &#x27;Harbour Quarter&#x27;, pattern: &#x27;ribbon&#x27;, specialty: &#x27;business&#x27; },
          { name: &#x27;Potters Ward&#x27;, pattern: &#x27;grid&#x27;, specialty: &#x27;industry&#x27; },
          { name: &#x27;Olive Crofts&#x27;, pattern: &#x27;resource&#x27;, specialty: &#x27;farm&#x27; },
          { name: &#x27;Outer Patio&#x27;, pattern: &#x27;commons&#x27;, specialty: &#x27;house&#x27; }
        ]
      }
    };
    const deck = decks[region];
    const rng = mulberry32(seed * 4099 + region.length * 67);
    const pool = deck.pool.map(item =&gt; ({ ...item }));
    for (let index = pool.length - 1; index &gt; 0; index--) {
      const swap = Math.floor(rng() * (index + 1));
      [pool[index], pool[swap]] = [pool[swap], pool[index]];
    }
    // Every settlement gets a viable food/industry base, but not in a fixed order.
    // Move them into the early growth set only when the shuffle put them too late.
    [&#x27;farm&#x27;, &#x27;industry&#x27;].forEach((specialty, earlySlot) =&gt; {
      const index = pool.findIndex(item =&gt; item.specialty === specialty);
      if (index &gt; 2) {
        const [item] = pool.splice(index, 1);
        pool.splice(1 + earlySlot, 0, item);
      }
    });
    const countRange = region === &#x27;north&#x27; ? 3 : 4;
    const count = (region === &#x27;north&#x27; ? 6 : 7) + seed % countRange;
    return {
      core: { ...deck.core[seed % deck.core.length], specialty: &#x27;business&#x27; },
      form: forms[region][(seed * 7 + region.length) % forms[region].length],
      districts: pool.slice(0, count)
    };
  }

  function formAxis(form, env) {
    if (!form.shoreAligned) return env.axis;
    return env.shoreSide &lt; 2 ? Math.PI / 2 : 0;
  }

  function formPosition(form, index, count, rng, env) {
    const axis = formAxis(form, env);
    const jitter = () =&gt; (rng() - 0.5);
    if (form.type === &#x27;spine&#x27;) {
      const side = index % 2 ? -1 : 1;
      const along = side * (185 + Math.floor(index / 2) * 92 + rng() * 25);
      return offset(offset(env.core, axis, along), axis + Math.PI / 2, jitter() * 125);
    }
    if (form.type === &#x27;cross&#x27;) {
      const branch = index % 4;
      const distance = 205 + Math.floor(index / 4) * 128 + rng() * 45;
      return offset(env.core, axis + branch * Math.PI / 2 + jitter() * 0.15, distance);
    }
    if (form.type === &#x27;twin&#x27;) {
      const hub = offset(env.core, axis + (index % 2 ? Math.PI : 0), 205);
      const orbit = 42 + Math.floor(index / 2) * 57;
      return offset(hub, axis + index * 2.17 + jitter() * 0.5, orbit);
    }
    if (form.type === &#x27;clusters&#x27;) {
      const cluster = index % 3;
      const hub = offset(env.core, axis + 0.25 + cluster * TAU / 3, 235 + cluster * 18);
      return offset(hub, index * 2.31 + axis, 28 + Math.floor(index / 3) * 82 + rng() * 24);
    }
    if (form.type === &#x27;crescent&#x27;) {
      const turn = count &lt;= 1 ? 0 : index / (count - 1);
      return offset(env.core, axis - 1.25 + turn * 2.5 + jitter() * 0.12, 245 + Math.sin(turn * Math.PI) * 75 + rng() * 30);
    }
    if (form.type === &#x27;fan&#x27;) {
      const turn = count &lt;= 1 ? 0 : index / (count - 1);
      return offset(env.core, axis - 1.05 + turn * 2.1 + jitter() * 0.12, 175 + index * 32 + rng() * 30);
    }
    const goldenAngle = 2.399963;
    return offset(env.core, axis + index * goldenAngle + jitter() * 0.36, 180 + Math.sqrt(index + 1) * 92 + rng() * 38);
  }

  function separateCenter(desired, existing, env) {
    let point = bounded(desired);
    for (let attempt = 0; attempt &lt; 18; attempt++) {
      const nearest = existing.reduce((distance, district) =&gt; Math.min(distance, Math.hypot(point.x - district.center.x, point.y - district.center.y)), Infinity);
      if (nearest &gt; 145 &amp;&amp; !isWater(point.x, point.y, env)) return point;
      point = bounded(offset(point, env.axis + attempt * 1.67, 39));
    }
    return point;
  }

  function dockPoint(env) {
    const shift = (env.seed % 2 ? 1 : -1) * 150;
    if (env.shoreSide === 0) return { x: shoreBoundary(env.core.y + shift, env) + 108, y: clamp(env.core.y + shift, 105, 575) };
    if (env.shoreSide === 1) return { x: canvas.width - shoreBoundary(env.core.y + shift, env) - 108, y: clamp(env.core.y + shift, 105, 575) };
    if (env.shoreSide === 2) return { x: clamp(env.core.x + shift, 120, 1000), y: shoreBoundary(env.core.x + shift, env) + 108 };
    return { x: clamp(env.core.x + shift, 120, 1000), y: canvas.height - shoreBoundary(env.core.x + shift, env) - 108 };
  }

  function makeDistricts(env) {
    const deck = regionalDeck(env.region, env.seed);
    const rng = mulberry32(env.seed * 6151 + env.region.length * 127);
    const unlocks = [80, 140, 220, 315, 420, 540, 675, 810, 930];
    const districts = [{ ...deck.core, unlock: 0, center: env.core, capacity: 40, density: env.region === &#x27;south&#x27; ? 0.84 : 0.72, roads: [], buildings: [] }];
    deck.districts.forEach((spec, index) =&gt; {
      let desired;
      if (spec.specialty === &#x27;farm&#x27;) desired = env.fields;
      else if (spec.specialty === &#x27;industry&#x27;) desired = env.forest;
      else if (spec.name.includes(&#x27;Harbour&#x27;)) desired = dockPoint(env);
      else desired = formPosition(deck.form, index, deck.districts.length, rng, env);
      const center = separateCenter(desired, districts, env);
      const densityBase = env.region === &#x27;south&#x27; ? 0.76 : env.region === &#x27;north&#x27; ? 0.6 : 0.68;
      districts.push({
        ...spec, unlock: unlocks[index], center,
        capacity: 32 + Math.floor(rng() * 17), density: densityBase + (rng() - 0.5) * 0.15,
        roads: [], buildings: []
      });
    });
    districts.form = deck.form;
    return districts;
  }

  function linePoints(center, angle, length, wave, phase) {
    const points = [];
    for (let index = -3; index &lt;= 3; index++) {
      const base = offset(center, angle, index / 3 * length / 2);
      points.push(bounded(offset(base, angle + Math.PI / 2, Math.sin(index * 0.9 + phase) * wave)));
    }
    return points;
  }

  function ringPoints(center, rx, ry, angle, count = 18) {
    const points = [];
    for (let index = 0; index &lt;= count; index++) {
      const turn = index / count * TAU;
      const lx = Math.cos(turn) * rx;
      const ly = Math.sin(turn) * ry;
      points.push(bounded({ x: center.x + lx * Math.cos(angle) - ly * Math.sin(angle), y: center.y + lx * Math.sin(angle) + ly * Math.cos(angle) }));
    }
    return points;
  }

  function makeLocalRoads(district, env) {
    const rng = mulberry32(env.seed * 8191 + district.name.length * 211);
    const center = district.center;
    const angle = env.axis + (rng() - 0.5) * 0.9;
    const roads = [];
    const add = (points, primary = false) =&gt; roads.push({ points, primary });
    if (district.pattern === &#x27;fort&#x27;) {
      add(ringPoints(center, 93, 66, angle), true);
      [0, Math.PI / 2].forEach(turn =&gt; add(linePoints(center, angle + turn, 220, 7, rng() * TAU), true));
    } else if (district.pattern === &#x27;crossroads&#x27;) {
      add(linePoints(center, angle, 275, 10, rng() * TAU), true);
      add(linePoints(center, angle + Math.PI / 2, 235, 9, rng() * TAU), true);
      add(ringPoints(center, 78, 53, angle), false);
    } else if (district.pattern === &#x27;grid&#x27;) {
      [-55, 0, 55].forEach((shift, index) =&gt; add(linePoints(offset(center, angle + Math.PI / 2, shift), angle, 270, 3, index), index === 1));
      [-50, 50].forEach((shift, index) =&gt; add(linePoints(offset(center, angle, shift), angle + Math.PI / 2, 190, 3, index), false));
    } else if (district.pattern === &#x27;contour&#x27;) {
      [-62, 0, 62].forEach((shift, index) =&gt; add(linePoints(offset(center, angle + Math.PI / 2, shift), angle, 285, 20, env.seed + index), index === 1));
      add(linePoints(offset(center, angle, 72), angle + Math.PI / 2, 145, 5, 0), false);
    } else if (district.pattern === &#x27;commons&#x27;) {
      add(ringPoints(center, 101, 68, angle), true);
      [0.2, 2.3, 4.4].forEach((turn, index) =&gt; add(linePoints(offset(center, angle + turn, 62), angle + turn, 145 + index * 12, 10, rng() * TAU), false));
    } else if (district.pattern === &#x27;courtyards&#x27;) {
      [-58, 0, 58].forEach((shift, index) =&gt; {
        const court = offset(center, angle, shift);
        add(ringPoints(court, 44 + index * 4, 33, angle + index * 0.2, 12), index === 1);
      });
      add(linePoints(center, angle, 260, 7, rng() * TAU), true);
    } else if (district.pattern === &#x27;irrigation&#x27;) {
      [-66, -22, 22, 66].forEach((shift, index) =&gt; add(linePoints(offset(center, angle + Math.PI / 2, shift), angle, 255, 5, index), index === 1));
      add(linePoints(center, angle + Math.PI / 2, 175, 3, 0), false);
    } else if (district.pattern === &#x27;resource&#x27;) {
      [0.1, 2.2, 4.25].forEach((turn, index) =&gt; add(linePoints(center, angle + turn, 225 - index * 8, 13, rng() * TAU), index === 0));
    } else if (district.pattern === &#x27;ribbon&#x27;) {
      const ribbonAngle = district.name.includes(&#x27;Harbour&#x27;) ? (env.shoreSide &lt; 2 ? Math.PI / 2 : 0) : angle;
      add(linePoints(center, ribbonAngle, 310, 17, env.seed), true);
      add(linePoints(offset(center, ribbonAngle + Math.PI / 2, 50), ribbonAngle, 225, 9, env.seed + 2), false);
    } else {
      add(linePoints(center, angle, 300, 17, env.seed), true);
      add(linePoints(offset(center, angle, -65), angle + 1.05, 155, 10, rng() * TAU), false);
      add(linePoints(offset(center, angle, 68), angle - 1.0, 150, 10, rng() * TAU), false);
    }
    district.roads = roads;
  }

  function connectDistricts(districts, env) {
    return districts.slice(1).map((district, index) =&gt; {
      const candidates = districts.slice(0, index + 1);
      const parent = candidates.reduce((best, candidate) =&gt; {
        const distance = Math.hypot(district.center.x - candidate.center.x, district.center.y - candidate.center.y);
        return !best || distance &lt; best.distance ? { candidate, distance } : best;
      }, null).candidate;
      const dx = district.center.x - parent.center.x;
      const dy = district.center.y - parent.center.y;
      const length = Math.hypot(dx, dy) || 1;
      const bend = (index % 2 ? 1 : -1) * (28 + env.seed % 19);
      return {
        unlock: district.unlock,
        points: [parent.center, { x: parent.center.x + dx * 0.35 - dy / length * bend, y: parent.center.y + dy * 0.35 + dx / length * bend }, { x: parent.center.x + dx * 0.7 - dy / length * bend * 0.45, y: parent.center.y + dy * 0.7 + dx / length * bend * 0.45 }, district.center]
      };
    });
  }

  function wallPlan(env, districts) {
    const form = districts.form;
    const rotation = formAxis(form, env) + (env.seed % 7 - 3) * 0.045;
    const gateAngles = districts.slice(1, 6).map(district =&gt; Math.atan2(district.center.y - env.core.y, district.center.x - env.core.x));
    const outerShape = {
      spine: [328, 176], cross: [278, 238], twin: [330, 205],
      clusters: [288, 232], crescent: [310, 212], fan: [294, 220], web: [285, 230]
    }[form.type] || [288, 225];
    return {
      inner: { center: env.core, rx: 150 + env.seed % 21, ry: 108 + env.seed % 17, rotation, seed: env.seed, gates: gateAngles.slice(0, 4) },
      outer: { center: env.core, rx: outerShape[0] + env.seed % 16, ry: outerShape[1] + env.seed % 14, rotation: rotation + 0.05, seed: env.seed + 13, gates: gateAngles }
    };
  }

  function wallLocal(point, wall) {
    const dx = point.x - wall.center.x;
    const dy = point.y - wall.center.y;
    return { x: dx * Math.cos(-wall.rotation) - dy * Math.sin(-wall.rotation), y: dx * Math.sin(-wall.rotation) + dy * Math.cos(-wall.rotation) };
  }

  function onWallCorridor(point, wall, margin) {
    const local = wallLocal(point, wall);
    const radius = Math.hypot(local.x / wall.rx, local.y / wall.ry);
    return Math.abs(radius - 1) &lt; margin / Math.min(wall.rx, wall.ry);
  }

  function civicPlan(env) {
    const side = env.seed % 2 ? 1 : -1;
    return {
      green: { ...offset(env.core, env.axis + side * Math.PI / 2, 47), rx: 38, ry: 25 },
      market: { ...offset(env.core, env.axis, 60), w: 43, h: 34 },
      tavern: { ...offset(env.core, env.axis - side * Math.PI / 2, 67), w: 31, h: 23 },
      church: { ...offset(env.core, env.axis + side * Math.PI / 2, 101), w: 58, h: 42 }
    };
  }

  function inRect(point, rect, margin) { return Math.abs(point.x - rect.x) &lt; rect.w / 2 + margin &amp;&amp; Math.abs(point.y - rect.y) &lt; rect.h / 2 + margin; }
  function inCivic(point, civic, margin) {
    const green = civic.green;
    const insideGreen = (point.x - green.x) ** 2 / ((green.rx + margin) ** 2) + (point.y - green.y) ** 2 / ((green.ry + margin) ** 2) &lt; 1;
    return insideGreen || inRect(point, civic.market, margin) || inRect(point, civic.tavern, margin) || inRect(point, civic.church, margin);
  }

  function segments(roads) {
    const result = [];
    roads.forEach(road =&gt; {
      for (let index = 1; index &lt; road.points.length; index++) {
        const a = road.points[index - 1];
        const b = road.points[index];
        const length = Math.hypot(b.x - a.x, b.y - a.y);
        if (length &gt; 1) result.push({ a, b, length, primary: road.primary });
      }
    });
    return result;
  }

  function constructionTimeline(maxPopulation) {
    const events = [];
    let houses = 0, businesses = 0, worksites = 0;
    for (let population = 1; population &lt;= maxPopulation; population++) {
      while (houses &lt; Math.floor(population / 5)) { events.push({ type: &#x27;house&#x27;, population }); houses++; }
      while (businesses &lt; Math.floor(population / 31)) { events.push({ type: &#x27;business&#x27;, population }); businesses++; }
      while (worksites &lt; Math.floor(population / 44)) { events.push({ type: worksites % 3 === 2 ? &#x27;industry&#x27; : &#x27;farm&#x27;, population }); worksites++; }
    }
    return events;
  }

  function radiusFor(type, region) {
    if (type === &#x27;farm&#x27;) return 13;
    if (type === &#x27;business&#x27;) return 9;
    if (region === &#x27;south&#x27;) return 8.5;
    if (region === &#x27;north&#x27;) return 9.5;
    return 8;
  }

  function validBuilding(point, type, placed, env, civic, walls) {
    const radius = radiusFor(type, env.region);
    if (point.x &lt; 58 || point.x &gt; 1062 || point.y &lt; 43 || point.y &gt; 637 || isWater(point.x, point.y, env) || inCivic(point, civic, radius + 3)) return false;
    if (onWallCorridor(point, walls.inner, radius + 6) || onWallCorridor(point, walls.outer, radius + 7)) return false;
    return placed.every(other =&gt; Math.hypot(point.x - other.x, point.y - other.y) &gt; radius + radiusFor(other.type, env.region) + 2);
  }

  function chooseDistrict(type, active, counts, rng) {
    let candidates = active.filter(district =&gt; (counts.get(district.name) || 0) &lt; district.capacity);
    if (!candidates.length) candidates = active;
    const specialty = type === &#x27;industry&#x27; ? &#x27;industry&#x27; : type;
    if (specialty !== &#x27;house&#x27;) {
      const preferred = candidates.filter(district =&gt; district.specialty === specialty);
      if (preferred.length) candidates = preferred;
    } else {
      candidates.sort((a, b) =&gt; ((counts.get(a.name) || 0) / a.capacity) - ((counts.get(b.name) || 0) / b.capacity));
      candidates = candidates.slice(0, Math.min(3, candidates.length));
    }
    return candidates[Math.floor(rng() * candidates.length)];
  }

  function placeBuildings(population, districts, env, civic, walls) {
    const rng = mulberry32(env.seed * 10007 + env.region.length * 313);
    const counts = new Map();
    const placed = [];
    constructionTimeline(1000).filter(event =&gt; event.population &lt;= population).forEach(event =&gt; {
      const active = districts.filter(district =&gt; district.unlock &lt;= event.population);
      let district = chooseDistrict(event.type, active, counts, rng);
      if (!district) return;
      let best = null;
      for (let attempt = 0; attempt &lt; 85; attempt++) {
        if (attempt === 43) district = chooseDistrict(event.type, active, counts, rng) || district;
        let pool = segments(district.roads);
        if (event.type === &#x27;business&#x27;) {
          const primary = pool.filter(segment =&gt; segment.primary);
          if (primary.length) pool = primary;
        }
        const segment = pool[Math.floor(rng() * pool.length)];
        if (!segment) continue;
        const t = 0.05 + rng() * 0.9;
        const roadPoint = { x: segment.a.x + (segment.b.x - segment.a.x) * t, y: segment.a.y + (segment.b.y - segment.a.y) * t };
        const nx = -(segment.b.y - segment.a.y) / segment.length;
        const ny = (segment.b.x - segment.a.x) / segment.length;
        const side = rng() &lt; 0.5 ? -1 : 1;
        const setback = (district.density &gt; 0.75 ? 15 : 20) + rng() * 15;
        const point = { x: roadPoint.x + nx * side * setback, y: roadPoint.y + ny * side * setback };
        if (!validBuilding(point, event.type, placed, env, civic, walls)) continue;
        const nearest = placed.length ? Math.min(...placed.map(other =&gt; Math.hypot(point.x - other.x, point.y - other.y))) : 22;
        const score = Math.abs(nearest - (district.density &gt; 0.75 ? 18 : 24)) + rng() * 5;
        if (!best || score &lt; best.score) best = { ...point, type: event.type, district, roadPoint, score };
      }
      if (!best) return;
      best.angle = Math.atan2(best.roadPoint.y - best.y, best.roadPoint.x - best.x);
      district.buildings.push(best);
      counts.set(district.name, (counts.get(district.name) || 0) + 1);
      placed.push(best);
    });
    return { placed, active: districts.filter(district =&gt; district.unlock &lt;= population) };
  }

  function drawTerrain(env, colors) {
    ctx.fillStyle = colors.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.strokeStyle = colors.border;
    ctx.globalAlpha = env.region === &#x27;north&#x27; ? 0.27 : 0.17;
    ctx.lineWidth = 1;
    for (let band = 0; band &lt; 9; band++) {
      ctx.beginPath();
      for (let step = 0; step &lt;= 80; step++) {
        const x = step / 80 * canvas.width;
        const y = 48 + band * 74 + Math.sin(step * 0.28 + env.seed + band) * (env.region === &#x27;north&#x27; ? 19 : 12);
        if (step === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = colors.farm;
    ctx.globalAlpha = env.region === &#x27;central&#x27; ? 0.17 : 0.1;
    ctx.beginPath();
    ctx.ellipse(env.fields.x, env.fields.y, env.fields.rx, env.fields.ry, env.axis * 0.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = colors.industry;
    ctx.globalAlpha = env.region === &#x27;north&#x27; ? 0.17 : 0.1;
    ctx.beginPath();
    ctx.ellipse(env.forest.x, env.forest.y, env.forest.rx, env.forest.ry, -env.axis * 0.15, 0, TAU);
    ctx.fill();
    const treeCount = env.region === &#x27;north&#x27; ? 54 : env.region === &#x27;central&#x27; ? 32 : 18;
    ctx.globalAlpha = 0.32;
    for (let index = 0; index &lt; treeCount; index++) {
      const angle = index * 2.41;
      const radius = Math.sqrt((index + 2) / (treeCount + 2));
      ctx.beginPath();
      ctx.arc(env.forest.x + Math.cos(angle) * env.forest.rx * radius, env.forest.y + Math.sin(angle) * env.forest.ry * radius, 3, 0, TAU);
      ctx.fill();
    }
    if (env.region === &#x27;south&#x27;) {
      ctx.fillStyle = colors.farm;
      ctx.globalAlpha = 0.28;
      for (let row = -3; row &lt;= 3; row++) {
        for (let col = -5; col &lt;= 5; col++) {
          ctx.beginPath();
          ctx.arc(env.fields.x + col * 13, env.fields.y + row * 12, 2.2, 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.restore();
    drawCoast(env, colors);
  }

  function drawCoast(env, colors) {
    ctx.save();
    ctx.fillStyle = colors.muted;
    ctx.beginPath();
    if (env.shoreSide === 0) { ctx.moveTo(0, 0); for (let y = 0; y &lt;= canvas.height; y += 8) ctx.lineTo(shoreBoundary(y, env), y); ctx.lineTo(0, canvas.height); }
    else if (env.shoreSide === 1) { ctx.moveTo(canvas.width, 0); for (let y = 0; y &lt;= canvas.height; y += 8) ctx.lineTo(canvas.width - shoreBoundary(y, env), y); ctx.lineTo(canvas.width, canvas.height); }
    else if (env.shoreSide === 2) { ctx.moveTo(0, 0); for (let x = 0; x &lt;= canvas.width; x += 8) ctx.lineTo(x, shoreBoundary(x, env)); ctx.lineTo(canvas.width, 0); }
    else { ctx.moveTo(0, canvas.height); for (let x = 0; x &lt;= canvas.width; x += 8) ctx.lineTo(x, canvas.height - shoreBoundary(x, env)); ctx.lineTo(canvas.width, canvas.height); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function strokeRoad(points, width, alpha, colors) {
    if (points.length &lt; 2) return;
    ctx.save(); ctx.beginPath();
    points.forEach((point, index) =&gt; index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y));
    ctx.strokeStyle = colors.road; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.lineCap = &#x27;round&#x27;; ctx.lineJoin = &#x27;round&#x27;; ctx.stroke(); ctx.restore();
  }

  function drawDistricts(districts, population, colors) {
    ctx.save(); ctx.font = &#x27;500 11px system-ui, sans-serif&#x27;;
    districts.filter(district =&gt; district.unlock &lt;= population).forEach(district =&gt; {
      const radius = 55 + Math.sqrt(Math.max(1, district.buildings.length)) * 8;
      ctx.strokeStyle = colors.border; ctx.globalAlpha = 0.38; ctx.setLineDash([7, 7]); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(district.center.x, district.center.y, radius * 1.22, radius * 0.8, 0, 0, TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = colors.mutedForeground; ctx.globalAlpha = 0.76;
      const label = `${district.name} · ${district.pattern}`;
      const textX = clamp(district.center.x - ctx.measureText(label).width / 2, 7, canvas.width - ctx.measureText(label).width - 7);
      ctx.fillText(label, textX, Math.max(15, district.center.y - radius * 0.8 - 6));
    });
    ctx.restore();
  }

  function drawRoads(districts, arterials, population, colors) {
    arterials.filter(road =&gt; road.unlock &lt;= population).forEach(road =&gt; strokeRoad(road.points, 8, 0.7, colors));
    districts.filter(district =&gt; district.unlock &lt;= population).forEach(district =&gt; district.roads.forEach(road =&gt; strokeRoad(road.points, road.primary ? 6 : 4, road.primary ? 0.62 : 0.43, colors)));
  }

  function gateParameter(worldAngle, wall) {
    const dx = Math.cos(worldAngle);
    const dy = Math.sin(worldAngle);
    const lx = dx * Math.cos(-wall.rotation) - dy * Math.sin(-wall.rotation);
    const ly = dx * Math.sin(-wall.rotation) + dy * Math.cos(-wall.rotation);
    return Math.atan2(ly / wall.ry, lx / wall.rx);
  }

  function angleDistance(a, b) {
    return Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
  }

  function wallPoint(wall, t) {
    const wobble = 1 + Math.sin(t * 5 + wall.seed) * 0.035 + Math.sin(t * 9 - wall.seed) * 0.018;
    const lx = Math.cos(t) * wall.rx * wobble;
    const ly = Math.sin(t) * wall.ry * wobble;
    return { x: wall.center.x + lx * Math.cos(wall.rotation) - ly * Math.sin(wall.rotation), y: wall.center.y + lx * Math.sin(wall.rotation) + ly * Math.cos(wall.rotation) };
  }

  function drawWall(wall, material, colors) {
    const gates = wall.gates.map(angle =&gt; gateParameter(angle, wall));
    const gap = material === &#x27;stone&#x27; ? 0.055 : 0.047;
    ctx.save();
    ctx.strokeStyle = material === &#x27;stone&#x27; ? colors.foreground : colors.farm;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = material === &#x27;stone&#x27; ? 5 : 3;
    ctx.globalAlpha = material === &#x27;stone&#x27; ? 0.76 : 0.7;
    ctx.lineCap = &#x27;round&#x27;;
    let drawing = false;
    ctx.beginPath();
    for (let step = 0; step &lt;= 180; step++) {
      const t = step / 180 * TAU;
      const gated = gates.some(gate =&gt; angleDistance(t, gate) &lt; gap);
      const point = wallPoint(wall, t);
      if (gated) { if (drawing) ctx.stroke(); ctx.beginPath(); drawing = false; continue; }
      if (!drawing) { ctx.moveTo(point.x, point.y); drawing = true; } else ctx.lineTo(point.x, point.y);
    }
    if (drawing) ctx.stroke();
    if (material === &#x27;stone&#x27;) {
      for (let tower = 0; tower &lt; 16; tower++) {
        const t = tower / 16 * TAU;
        if (gates.some(gate =&gt; angleDistance(t, gate) &lt; gap * 1.8)) continue;
        const point = wallPoint(wall, t);
        ctx.fillRect(point.x - 3.5, point.y - 3.5, 7, 7);
      }
    } else {
      ctx.setLineDash([2, 5]);
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      for (let step = 0; step &lt;= 120; step++) {
        const point = wallPoint(wall, step / 120 * TAU);
        if (step === 0) ctx.moveTo(point.x, point.y); else ctx.lineTo(point.x, point.y);
      }
      ctx.stroke();
    }
    gates.forEach(gate =&gt; {
      const point = wallPoint(wall, gate);
      ctx.save(); ctx.translate(point.x, point.y); ctx.rotate(gate + wall.rotation); ctx.fillRect(-2, -9, 4, 18); ctx.restore();
    });
    ctx.restore();
  }

  function drawDefences(stage, walls, colors) {
    if (stage.level &lt; 2) return;
    if (stage.level &lt; 4) drawWall(walls.inner, &#x27;wood&#x27;, colors);
    else { drawWall(walls.outer, &#x27;wood&#x27;, colors); drawWall(walls.inner, &#x27;stone&#x27;, colors); }
  }

  function drawBuilding(building, env, colors) {
    const fills = { house: colors.house, farm: colors.farm, industry: colors.industry, business: colors.business };
    if (building.type === &#x27;farm&#x27;) {
      ctx.save(); ctx.translate(building.x - Math.cos(building.angle) * 17, building.y - Math.sin(building.angle) * 17); ctx.rotate(building.angle);
      ctx.fillStyle = colors.farm; ctx.globalAlpha = 0.2; ctx.fillRect(-10, -7, 20, 14); ctx.restore();
    }
    ctx.save(); ctx.translate(building.x, building.y); ctx.rotate(building.angle); ctx.fillStyle = fills[building.type]; ctx.globalAlpha = 0.88;
    let width = building.type === &#x27;business&#x27; ? 13 : building.type === &#x27;farm&#x27; ? 14 : 11;
    let height = building.type === &#x27;business&#x27; ? 10 : 8;
    if (building.type === &#x27;house&#x27; &amp;&amp; env.region === &#x27;north&#x27;) { width = 16; height = 7; }
    if (building.type === &#x27;house&#x27; &amp;&amp; env.region === &#x27;south&#x27;) { width = 10; height = 10; }

    ctx.fillStyle = colors.foreground; ctx.font = &#x27;500 10px system-ui, sans-serif&#x27;; ctx.fillText(&#x27;Moot Hall&#x27;, env.core.x - 22, env.core.y - 15);
    const marketName = env.region === &#x27;south&#x27; ? &#x27;Bazaar&#x27; : &#x27;Market&#x27;;
    const tavernName = env.region === &#x27;south&#x27; ? &#x27;Inn&#x27; : &#x27;Tavern&#x27;;
    if (stage.level &gt;= 2) { civicRect(civic.market, &#x27;market&#x27;, marketName, colors); civicRect(civic.tavern, &#x27;tavern&#x27;, tavernName, colors); }

  function render() {

    const seed = Number(seedControl.value);
    const region = selectedRegion(seed);
    const stage = stageFor(population);
    const colors = palette();
    const env = makeEnvironment(seed, region);
    const districts = makeDistricts(env);
    districts.forEach(district =&gt; makeLocalRoads(district, env));
    const arterials = connectDistricts(districts, env);
    const walls = wallPlan(env, districts);
    const civic = civicPlan(env);
    const city = placeBuildings(population, districts, env, civic, walls);
    drawTerrain(env, colors);
    drawDistricts(districts, population, colors);
    drawRoads(districts, arterials, population, colors);
    drawDefences(stage, walls, colors);
    city.placed.forEach(building =&gt; drawBuilding(building, env, colors));
    drawCivic(env, civic, stage, colors);

    const defence = stage.level &lt; 2 ? &#x27;none&#x27; : stage.level &lt; 4 ? &#x27;inner timber&#x27; : &#x27;stone inner + timber outer&#x27;;
    root.querySelector(&#x27;#regional-population-value&#x27;).textContent = `${population} NPCs`;
    root.querySelector(&#x27;#regional-seed-value&#x27;).textContent = String(seed);
    root.querySelector(&#x27;#regional-level&#x27;).textContent = `Level ${stage.level} · ${stage.name}`;
    root.querySelector(&#x27;#regional-name&#x27;).textContent = `${region[0].toUpperCase()}${region.slice(1)} tradition`;
    root.querySelector(&#x27;#regional-form&#x27;).textContent = districts.form.name;
    root.querySelector(&#x27;#regional-districts&#x27;).textContent = String(city.active.length);

  }

  [styleControl, populationControl, seedControl].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, render));
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: [&#x27;class&#x27;, &#x27;style&#x27;] });
  render();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
