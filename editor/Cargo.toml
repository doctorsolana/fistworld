[package]
name = "editor"
version = "0.1.0"
edition = "2021"
# Two binaries (`editor` and `worldgen`), so bare `cargo run -p editor` needs a default.
default-run = "editor"

[features]
# Iteration speed: links Bevy as a shared library so a code change relinks in seconds
# instead of rebuilding the whole binary. Dev only - never ship with this on.
#   cargo run -p editor --features dev
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true }
shared = { path = "../shared" }
serde = { workspace = true }
ron = { workspace = true }
bevy_egui = "0.41"
noise = { workspace = true }
